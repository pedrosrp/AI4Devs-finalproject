apiVersion: v1
kind: ConfigMap
metadata:
  name: aura-microsite-proxy-config
data:
  nginx.conf: |
    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        location ~ ^/e/(?<slug>[^/]+)$ {
            proxy_pass http://aura-minio:9000/static-sites/$slug/index.html;
            proxy_set_header Host aura-minio:9000;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~ ^/e/(?<slug>[^/]+)/(?<file>.+)$ {
            proxy_pass http://aura-minio:9000/static-sites/$slug/$file;
            proxy_set_header Host aura-minio:9000;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
