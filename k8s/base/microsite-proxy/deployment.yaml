apiVersion: apps/v1
kind: Deployment
metadata:
  name: aura-microsite-proxy
  labels:
    app: aura-microsite-proxy
spec:
  selector:
    matchLabels:
      app: aura-microsite-proxy
  template:
    metadata:
      labels:
        app: aura-microsite-proxy
    spec:
      initContainers:
        - name: ensure-public-bucket
          image: minio/mc:latest
          command:
            - /bin/sh
            - -c
            - |
              mc alias set local http://aura-minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" || exit 1
              mc mb --ignore-existing local/static-sites
              mc anonymous set download local/static-sites
          envFrom:
            - secretRef:
                name: aura-minio-secret
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: config
          configMap:
            name: aura-microsite-proxy-config
