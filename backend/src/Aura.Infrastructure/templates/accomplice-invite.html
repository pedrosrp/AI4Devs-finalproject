<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body style="margin: 0; padding: 0; background-color: #FDFBF7; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol'; color: #6B6560;">
    <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: #FDFBF7; padding: 40px 20px;">
        <tr>
            <td align="center">
                <table width="600" cellpadding="0" cellspacing="0" border="0" style="background-color: #FFFFFF; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
                    <tr>
                        <td align="center" style="padding: 40px 40px 20px 40px;">
                            <div style="display: inline-block; vertical-align: middle;">
                                <div style="display: inline-block; width: 32px; height: 32px; background-color: #7C9A72; border-radius: 50%; vertical-align: middle; margin-right: 12px;"></div>
                                <span style="font-family: 'Playfair Display', Georgia, serif; font-size: 28px; font-weight: 700; color: #2C3E50; vertical-align: middle;">Aura</span>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding: 20px 40px 40px 40px; text-align: center;">
                            <h1 style="font-family: 'Playfair Display', Georgia, serif; font-size: 24px; font-weight: 700; color: #2C3E50; margin: 0 0 16px 0;">You are invited as an accomplice!</h1>
                            <p style="font-size: 16px; line-height: 1.5; margin: 0 0 16px 0;">Hi {{guestName}},</p>
                            <p style="font-size: 16px; line-height: 1.5; margin: 0 0 32px 0;">You have been invited to <strong>{{eventName}}</strong> by {{primaryGuestName}}.</p>
                            <a href="{{rsvpLink}}" style="display: inline-block; background-color: #7C9A72; color: #FFFFFF; text-decoration: none; padding: 14px 28px; border-radius: 12px; font-weight: 600; font-size: 16px;">RSVP Now &rarr;</a>
                        </td>
                    </tr>
                </table>
                <table width="600" cellpadding="0" cellspacing="0" border="0">
                    <tr>
                        <td align="center" style="padding: 24px; font-size: 12px; color: #A09B96;">
                            <p style="margin: 0 0 8px 0;">If you didn't expect this email, you can safely ignore it.</p>
                            <p style="margin: 0;">&copy; 2026 Aura Planning. All rights reserved.</p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
