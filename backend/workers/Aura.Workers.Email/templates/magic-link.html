<!DOCTYPE html>
<html>
<body>
<div style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; border: 1px solid #e0e0e0; border-radius: 8px;">
    <div style="text-align: center; margin-bottom: 20px;">
        <h1 style="color: #2c3e50; margin: 0;">Sign in to Aura</h1>
    </div>
    <div style="background-color: #f9f9f9; padding: 20px; border-radius: 8px; text-align: center;">
        <p style="color: #333; font-size: 16px; margin-bottom: 20px;">Hi {{guestName}},</p>
        <p style="color: #333; font-size: 16px; margin-bottom: 20px;">Click the button below to sign in to your account.</p>
        <a href="{{magicLink}}" style="display: inline-block; background-color: #4CAF50; color: white; padding: 12px 24px; text-decoration: none; border-radius: 4px; font-weight: bold; font-size: 16px;">Sign In</a>
        <p style="color: #7f8c8d; font-size: 12px; margin-top: 20px;">If the button doesn't work, copy and paste this link into your browser:<br/><a href="{{magicLink}}" style="color: #3498db;">{{magicLink}}</a></p>
    </div>
</div>
</body>
</html>
